# Explicit disposable integration stack. Prisma owns the application migrations.
project_id = "bondi-migration-rehearsal"

[api]
enabled = true
port = 54331
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54332
shadow_port = 54330
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3100"
additional_redirect_urls = []
jwt_expiry = 3600
signing_keys_path = "./signing_keys.json"
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true

[edge_runtime]
enabled = false

[analytics]
enabled = false
