name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bondi
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: bondi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bondi -d bondi_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bondi:synthetic-test-password@localhost:5432/bondi_test
      DIRECT_URL: postgresql://bondi:synthetic-test-password@localhost:5432/bondi_test
      BETTER_AUTH_SECRET: synthetic-ci-secret-at-least-32-characters
      BETTER_AUTH_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run check
      - name: Apply migrations to disposable CI database
        run: npm run db:migrate
      # This job proves ordinary PostgreSQL schema/build/unit compatibility.
      # Live application journeys run on the actual native platform below.

  native-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Generation needs a syntactic URL before the explicit stack preparation replaces it.
      DATABASE_URL: postgresql://postgres:synthetic-generation-only@127.0.0.1:54322/postgres
      DIRECT_URL: postgresql://postgres:synthetic-generation-only@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Start owned disposable native Supabase stack
        run: npm run supabase:keys:prepare && npm run supabase:start
      - name: Prepare native target identity and private synthetic environment
        run: npm run supabase:test:prepare
      - name: Apply application migrations explicitly to disposable Supabase Postgres
        run: npm run db:migrate
      - run: npm run check
      - run: npx --no-install playwright install --with-deps chromium
      - name: Native API role and database safety boundaries
        run: npm run test:supabase
      - name: Retained application journeys on native Supabase Postgres
        run: npm run test:e2e
      - name: Stop only the owned native project
        if: always()
        run: npm run supabase:stop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-native-browser-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 3

  migration-rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:synthetic-generation-only@127.0.0.1:54332/postgres
      DIRECT_URL: postgresql://postgres:synthetic-generation-only@127.0.0.1:54332/postgres
      BONDI_PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Install PostgreSQL 17 clients from the official signed repository
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/bondi-pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-17
      - name: Explicit isolated source and native target preparation
        run: npm run migration:local -- prepare --confirm-project bondi-migration-rehearsal
      - name: Explicit application schema and synthetic fixture preparation
        run: |
          npm run migration:schema -- --confirm-project bondi-migration-rehearsal
          npm run migration:fixtures -- --confirm-project bondi-migration-rehearsal
      - name: Build application without database mutation
        run: npm run migration:build -- --confirm-project bondi-migration-rehearsal
      - name: Preserve genuine legacy-account cookies before the write fence
        run: npm run migration:accounts -- --confirm-project bondi-migration-rehearsal
      - name: Capture and prove atomic restore failure with a usable source
        run: |
          npm run migration:transfer -- capture --confirm-project bondi-migration-rehearsal
          npm run migration:transfer -- prove-failure --confirm-project bondi-migration-rehearsal
          npm run migration:qualify -- source --confirm-project bondi-migration-rehearsal
      - name: Restore and qualify the exact captured data without accepting writes
        run: |
          npm run migration:transfer -- restore --confirm-project bondi-migration-rehearsal
          npm run migration:qualify -- target --confirm-project bondi-migration-rehearsal
      - name: Rehearse before-write rollback and qualify the source again
        run: |
          npm run migration:transfer -- rollback --confirm-project bondi-migration-rehearsal
          npm run migration:qualify -- source --confirm-project bondi-migration-rehearsal
          npm run migration:transfer -- reselect --confirm-project bondi-migration-rehearsal
          npm run migration:transfer -- accept --confirm-project bondi-migration-rehearsal
      - name: Verify live negative guards and the post-write rollback boundary
        run: npm run migration:guards -- --confirm-project bondi-migration-rehearsal
      - name: Recover original pending work through real private native subscribers
        run: npm run migration:delivery -- --confirm-project bondi-migration-rehearsal
      - run: npx --no-install playwright install --with-deps chromium
      - name: Qualify migrated accounts, idempotency, browser chat and location
        run: npm run test:migration -- --confirm-project bondi-migration-rehearsal
      - name: Read-only native security advisors for the restored target
        run: npx --no-install supabase db advisors --local --workdir tooling/migration-rehearsal --type security --fail-on warn
      - name: Stop only the owned isolated migration resources
        if: always()
        run: npm run migration:local -- stop --confirm-project bondi-migration-rehearsal
